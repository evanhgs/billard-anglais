name: Build Binaries

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: billard-linux
            output_path: dist/billard
          - os: windows-latest
            artifact_name: billard-windows
            output_path: dist/billard.exe
          - os: macos-latest
            artifact_name: billard-macos
            output_path: dist/billard

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build executable
        run: |
          pyinstaller --onefile --windowed --name billard game.py

      - name: Prepare artifact (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          mkdir -p release
          cp "${{ matrix.output_path }}" "release/${{ matrix.artifact_name }}"

      - name: Prepare artifact (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release -Force | Out-Null
          Copy-Item "${{ matrix.output_path }}" "release/${{ matrix.artifact_name }}.exe"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: release/*
          if-no-files-found: error

